    <style>
      /* ------------------------------------------------------------------
         Preview-only chrome. In DSH the window frame, titlebar, rails and
         the --dsw-alias-* theme tokens are supplied by the host; this shell
         reproduces them so the workbench can be screenshotted standalone.
         Dark values below are the colors measured from the Codex reference
         screenshot (recon/ui-spec.md §5.1), not new design tokens.
         ------------------------------------------------------------------ */
      * { box-sizing: border-box; }
      .pv-settings-host { height:100%; overflow-y:auto; background:var(--dsw-alias-bg-layer-2); }
      html, body { height: 100%; margin: 0; }
      body {
        background: #202020;
        color: #fff;
        font: 14px/20px Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        overflow: hidden;
      }

        --pv-chrome: #202020;
        --pv-divider: #2b2b2b;
        --dsw-alias-bg-base: #181818;
        --dsw-alias-bg-layer-1: #1b1b1b;

        --dsw-alias-border-l3: #3e3e3e;

      /* window frame ---------------------------------------------------- */
      .pv-window { display: flex; flex-direction: column; height: 100vh; min-height: 0; }
      .pv-titlebar {
        flex: none; display: flex; align-items: center; gap: 16px; height: 44px;
        padding: 0 16px 0 14px; background: var(--pv-chrome); color: #8f8f8f;
        -webkit-user-select: none; user-select: none;
      }
      body[data-theme="light"] .pv-titlebar { color: #61666b; }
      .pv-nav { display: inline-flex; align-items: center; gap: 14px; }
      .pv-menu { display: inline-flex; align-items: center; gap: 18px; font-size: 13px; }
      .pv-titlebar-spacer { flex: 1; }
      .pv-preview-tag {
        font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
        color: #8f8f8f; border: 1px solid #3a3a3a; border-radius: 4px; padding: 1px 5px;
      }

      .pv-wincontrols { display: inline-flex; align-items: center; gap: 20px; }
      .pv-body { flex: 1; display: flex; min-height: 0; background: var(--pv-chrome); }

      /* left icon rail --------------------------------------------------- */
      .pv-rail {
        flex: 0 0 52px; width: 52px; display: flex; flex-direction: column;
        align-items: center; gap: 6px; padding: 10px 0 14px; color: #aeaeae;
      }
      body[data-theme="light"] .pv-rail { color: #6b727a; }
      .pv-rail-item {
        display: grid; place-items: center; width: 36px; height: 36px;
        border-radius: 8px; color: inherit; opacity: .62;
      }
      .pv-rail-item--active {
        opacity: 1; background: #2d2d2d; color: #fff;
      }
      body[data-theme="light"] .pv-rail-item--active { background: #e3e6ea; color: #0f1115; }
      .pv-rail-sep { width: 24px; height: 1px; background: #2b2b2b; margin: 4px 0; }
      body[data-theme="light"] .pv-rail-sep { background: #e1e5ee; }
      .pv-rail-avatar {
        margin-top: auto; width: 25px; height: 25px; border-radius: 50%;
        background: #4a4f55; color: #fff; display: grid; place-items: center;
        font-size: 11px; font-weight: 700;
      }

      /* plugin stage ----------------------------------------------------- */
      #pv-stage { flex: 1; min-width: 0; min-height: 0; display: flex; }
      #root { flex: 1; min-width: 0; min-height: 0; }
      .pv-loading { padding: 32px; color: #aeaeae; font-size: 13px; }

    <script>
      /* ------------------------------------------------------------------
         Preview host shim: implements just enough of the DSH client contract
         (window.__ModuleLoader__, ctx.locale/ctx.slots) to mount the very same
         plugin bundle the Host ships, then drives it into a screenshot scene.
         ------------------------------------------------------------------ */
      ;(function () {
        'use strict'
        var params = new URLSearchParams(location.search)
        var theme = params.get('theme') === 'light' ? 'light' : 'dark'
        document.body.dataset.theme = theme
        document.body.toggleAttribute('data-ds-dark-theme', theme === 'dark')

        var scene = params.get('scene') || 'default'
        var mockMode = params.get('mode') || (scene === 'review' || scene === 'v11-inline-findings' ? 'done' : scene)
        // The comments scene asks the mock /pr route for the inline-comment fixture.
        var mockScenario =
          params.get('mode') === 'comments' || scene === 'v11-existing-comments' ? 'comments' : ''
        // v2 dev knobs: script the merge guard / chat SSE behaviour per request.
        var mockMerge = params.get('mockMerge') || ''
        var chatCalls = 0
        // v2.1 dev knobs: shorten auto-review polling in preview and script the mock.
        var mockAuto =
          params.get('mockAuto') || (scene === 'v2.1-auto-review-missing' ? 'missing' : '')
        if (scene === 'v2.1-auto-review' || scene === 'v2.1-auto-review-missing') {
          window.__CR_AUTO_POLL_MS__ = 1200
        }
        window.__CR_AUTO_MISSING_CALLS__ = 0
        // v2.2 dev knob: simulate an older Host without the publish route.
        var mockPublish =
          params.get('mockPublish') || (scene === 'v2.2-publish-missing' ? 'missing' : '')
        window.__CR_PUBLISH_MISSING_CALLS__ = 0

        // The v2 scenes start from a clean chat history so screenshots/tests are
        // deterministic even when the preview profile has run before.
        try {
          if (scene === 'v2-chat' || scene === 'v2-merge-dialog') {
            Object.keys(localStorage).forEach(function (key) {
              if (key.indexOf('codex-review:chat:') === 0) localStorage.removeItem(key)
            })
          }
        } catch (error) {
          /* localStorage may be unavailable */
        }

        // Route review-start to the mock server's mode (dev-only field).
        var nativeFetch = window.fetch.bind(window)
        window.fetch = function (input, init) {
          try {
            if (typeof input === 'string' && input.indexOf('codex-review/review-publish') >= 0) {
              if (mockPublish === 'missing') {
                // Older Host: the route itself does not exist.
                window.__CR_PUBLISH_MISSING_CALLS__ += 1
                return Promise.resolve(
                  new Response(
                    JSON.stringify({ ok: false, error: { code: 'GH_NOT_FOUND', message: '没有这个路由' } }),
                    { status: 404, headers: { 'content-type': 'application/json' } },
                  ),
                )
              }
              if (init && typeof init.body === 'string' && mockPublish !== '') {
                var publishPayload = JSON.parse(init.body)
                publishPayload.mockPublish = mockPublish
                init = Object.assign({}, init, { body: JSON.stringify(publishPayload) })
              }
            }
            if (
              mockPublish === 'missing' &&
              typeof input === 'string' &&
              input.indexOf('codex-review/auto-review-status') >= 0
            ) {
              // Older Host: the status payload has no publish config at all.
              return nativeFetch(input, init).then(function (response) {
                return response.json().then(function (envelope) {
                  if (envelope && envelope.ok && envelope.value) delete envelope.value.publish
                  return new Response(JSON.stringify(envelope), {
                    status: response.status,
                    headers: { 'content-type': 'application/json' },
                  })
                })
              })
            }
            if (typeof input === 'string' && input.indexOf('codex-review/auto-review') >= 0) {
              if (mockAuto === 'missing') {
                // Simulate an older Host that has no auto-review routes.
                window.__CR_AUTO_MISSING_CALLS__ += 1
                return Promise.resolve(
                  new Response(
                    JSON.stringify({ ok: false, error: { code: 'GH_NOT_FOUND', message: '没有这个路由' } }),
                    { status: 404, headers: { 'content-type': 'application/json' } },
                  ),
                )
              }
              if (init && typeof init.body === 'string' && mockAuto !== '') {
                var autoPayload = JSON.parse(init.body)
                autoPayload.mockAuto = mockAuto
                init = Object.assign({}, init, { body: JSON.stringify(autoPayload) })
              }
            }
            if (typeof input === 'string' && input.indexOf('codex-review/') >= 0 && init && typeof init.body === 'string') {
              if (input.indexOf('review-start') >= 0) {
                var payload = JSON.parse(init.body)
                payload.mockMode = mockMode
                init = Object.assign({}, init, { body: JSON.stringify(payload) })
              }
              if (input === 'codex-review/pr') {
                var prPayload = JSON.parse(init.body)
                prPayload.mockScenario = mockScenario
                init = Object.assign({}, init, { body: JSON.stringify(prPayload) })
              }
              if (input === 'codex-review/chat') {
                var chatPayload = JSON.parse(init.body)
                chatCalls += 1
                chatPayload.mockChat =
                  mockMerge === 'chat-error' ? 'error' : scene === 'v2-chat' && chatCalls > 1 ? 'slow' : 'stream'
                init = Object.assign({}, init, { body: JSON.stringify(chatPayload) })
              }
              if (input === 'codex-review/merge' && mockMerge !== '' && mockMerge.indexOf('chat-') !== 0) {
                var mergePayload = JSON.parse(init.body)
                mergePayload.mockMerge = mockMerge
                init = Object.assign({}, init, { body: JSON.stringify(mergePayload) })
              }
            }
            if (typeof input === 'string' && input.indexOf('codex-review/health') >= 0 && scene === 'health') {
              return Promise.resolve(new Response(JSON.stringify({ ok: true, value: { gh: 'not-logged-in', llm: 'ok', version: '0.1.0' } }), { headers: { 'content-type': 'application/json' } }))
            }
          } catch (error) {
            /* fall through to the real fetch */
          }
          return nativeFetch(input, init)
        }

        window.addEventListener('error', function (event) {
          document.body.dataset.previewError = String((event && (event.message || (event.error && event.error.stack))) || 'error')
        })
        window.addEventListener('unhandledrejection', function (event) {
          document.body.dataset.previewError = String((event && event.reason && (event.reason.stack || event.reason.message)) || 'unhandledrejection')
        })

        var definitions = []
        window.__ModuleLoader__ = {
          load: function (definition) {
            if (!definition || typeof definition.factory !== 'function') {
              throw new Error('preview loader: bundle did not call load() with a factory')
            }
            definitions.push(definition)
          },
        }

        function boot() {
          if (definitions.length !== 1) {
            document.getElementById('root').innerHTML =
              '<div class="pv-loading">client.js 没有注册 module（definitions=' + definitions.length + '）</div>'
            return
          }
          var definition = definitions[0]
          var platform = {
            react: window.React,
            'react-dom': window.ReactDOM,
            'react-dom/client': window.ReactDOM,
            'react/jsx-runtime': {
              jsx: window.React.createElement,
              jsxs: window.React.createElement,
              Fragment: window.React.Fragment,
            },
          }
          var plugin = definition.factory(function (name) {
            if (Object.prototype.hasOwnProperty.call(platform, name)) return platform[name]
            throw new Error('preview loader: unsupported platform module ' + name)
          })

          var zh = plugin.__test.locales.zh
          var t = function (key) {
            return Object.prototype.hasOwnProperty.call(zh, key) ? zh[key] : key
          }
          var registrations = []
          var localeNamespaces = []
          var ctx = {
            effect: function (factory) {
              var dispose = factory()
              return function () {
                if (typeof dispose === 'function') dispose()
              }
            },
            locale: {
              register: function (namespace, dictionaries) {
                localeNamespaces.push(namespace)
                return function () {}
              },
              bind: function () {
                return t
              },
            },
            slots: {
              inject: function (key, callback) {
                callback()
                return function () {}
              },
              register: function (options, component) {
                registrations.push({ options: options, component: component })
                return function () {}
              },
            },
          }
          plugin.apply(ctx)

          var main = registrations.filter(function (entry) { return entry.options.name === 'main' })[0]
          var panels = registrations.filter(function (entry) { return entry.options.name === 'sidebar.panellist' })[0]
          if (!main) throw new Error('preview loader: plugin did not register a main slot')

          // Expose the registration facts so the dev shell can assert them.
          window.__CR_PREVIEW__ = {
            id: definition.id,
            registrations: registrations.map(function (entry) { return entry.options }),
            localeNamespaces: localeNamespaces,
            panelLabel: panels && typeof panels.options.label === 'function' ? panels.options.label() : null,
            test: plugin.__test,
          }
          document.title = '代码审查 · ' + scene

          var root = window.ReactDOM.createRoot(document.getElementById('root'))
          if (scene === 'settings') {
            // Dev-only: render the DSH Settings section alone so its layout and
            // control styling can be inspected without opening the real panel.
            var section = registrations.filter(function (entry) {
              return entry.options.name === 'settings.section'
            })[0]
            if (!section) throw new Error('preview loader: plugin did not register settings.section')
            root.render(
              window.React.createElement(
                'div',
                { className: 'pv-settings-host' },
                window.React.createElement(section.component, { t: t }),
              ),
            )
            waitFor(function () { return document.querySelector('[data-cr-settings-page]') }, 8000)
              .then(function (found) {
                if (!found) throw new Error('settings page never mounted')
                return waitFor(function () { return document.querySelectorAll('.cr-set-row').length >= 4 }, 8000)
              })
              .then(function () {
                document.body.dataset.previewReady = '1'
                document.body.dataset.previewScene = scene
                window.__PREVIEW_READY__ = true
                console.info('[preview] scene ready:', scene)
              })
              .catch(function (error) {
                document.body.dataset.previewError = String((error && error.stack) || error)
                console.error('[preview] scene failed', error)
              })
            return
          }
          root.render(window.React.createElement(main.component, { t: t }))
          drive(plugin, main)
        }

        function waitFor(predicate, timeout) {
          var limit = timeout || 8000
          var start = Date.now()
          return new Promise(function (resolve) {
            ;(function tick() {
              var value = false
              try {
                value = predicate()
              } catch (error) {
                value = false
              }
              if (value) return resolve(true)
              if (Date.now() - start > limit) return resolve(false)
              requestAnimationFrame(tick)
            })()
          })
        }

        function click(selector) {
          var node = document.querySelector(selector)
          if (!node) return false
          node.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }))
          return true
        }

        function setInput(selector, value) {
          var input = document.querySelector(selector)
          if (!input) return false
          var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set
          setter.call(input, value)
          input.dispatchEvent(new Event('input', { bubbles: true }))
          return true
        }

        function scrollDocTo(selector, offset) {
          var doc = document.querySelector('.cr-doc')
          var node = document.querySelector(selector)
          if (!doc || !node) return
          var docBox = doc.getBoundingClientRect()
          var nodeBox = node.getBoundingClientRect()
          doc.scrollTop = doc.scrollTop + (nodeBox.top - docBox.top) - (offset || 8)
        }

        /** Center a node (inside the doc scroller) without touching the page scroll. */
        function centerInDoc(selector, offset) {
          var doc = document.querySelector('.cr-doc')
          var node = document.querySelector(selector)
          if (!doc || !node) return
          var docBox = doc.getBoundingClientRect()
          var nodeBox = node.getBoundingClientRect()
          doc.scrollTop = doc.scrollTop + (nodeBox.top - docBox.top) - (offset || 80)
        }

        function drive(plugin, main) {
          var ready = false
          Promise.resolve()
            .then(function () { return waitFor(function () { return document.querySelector('[data-pr-number]') }) })
            .then(function (found) {
              if (!found) return
              if (scene === 'empty') {
                setInput('.cr-search input', 'zzz-不存在的关键词')
                return waitFor(function () { return document.querySelector('.cr-list-state') })
              }
              click('[data-pr-number="129"]')
              return waitFor(function () { return document.querySelector('[data-cr-pr-head]') })
            })
            .then(function () {
              if (scene === 'changes') {
                click('[data-tab="changes"]')
                return waitFor(function () { return document.querySelector('[data-cr-changes]') }).then(function () {
                  click('button[data-file-index="1"]')
                  click('button[data-file-index="2"]')
                  return waitFor(function () { return document.querySelectorAll('.cr-file--open .cr-diff').length >= 2 })
                })
              }
              if (scene === 'review' || scene === 'running' || scene === 'error' || scene === 'partial' || scene === 'empty-review') {
                click('[data-action="review"]')
                var wanted = scene === 'running' ? 'running' : scene === 'error' ? 'error' : 'done'
                return waitFor(function () {
                  return document.querySelector('[data-cr-review-state="' + wanted + '"]')
                }, 12000).then(function () {
                  var doc = document.querySelector('.cr-doc')
                  if (doc) doc.scrollTop = 0
                })
              }
              if (scene === 'v11-inline-findings') {
                // Run a review, then use "locate in diff": it opens Changes, expands
                // the file, highlights the line and expands the inline finding card.
                click('[data-action="review"]')
                return waitFor(function () {
                  return document.querySelector('[data-cr-review-state="done"]')
                }, 12000).then(function () {
                  var locate = document.querySelector('[data-action="locate"]')
                  if (locate) locate.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }))
                  return waitFor(function () { return document.querySelector('.cr-inline-card') }, 12000)
                })
              }
              if (scene === 'v11-settings') {
                click('[data-action="review-settings"]')
                return waitFor(function () { return document.querySelector('[data-cr-settings]') })
              }
              if (scene === 'v11-existing-comments') {
                click('[data-tab="changes"]')
                return waitFor(function () { return document.querySelector('[data-cr-changes]') }).then(function () {
                  // The comment fixture anchors comments in files 1 / 6 / 7.
                  click('button[data-file-index="1"]')
                  click('button[data-file-index="6"]')
                  click('button[data-file-index="7"]')
                  return waitFor(function () {
                    return document.querySelectorAll('.cr-inline-comment').length >= 2
                  }, 12000)
                })
              }
              if (scene === 'v2-merge-dialog') {
                click('[data-action="merge"]')
                return waitFor(function () { return document.querySelector('[data-cr-merge-dialog]') })
              }
              if (scene === 'v2-chat') {
                click('[data-action="chat-open"]')
                return waitFor(function () { return document.querySelector('[data-cr-chat]') }).then(function () {
                  click('[data-action="chat-quick"][data-quick-index="0"]')
                  return waitFor(function () {
                    var root = document.querySelector('[data-cr-root]')
                    return root && root.getAttribute('data-cr-chat-streaming') === 'true'
                  }, 6000).then(function () {
                    return waitFor(function () {
                      var root = document.querySelector('[data-cr-root]')
                      return (
                        root &&
                        root.getAttribute('data-cr-chat-streaming') === 'false' &&
                        document.querySelectorAll('[data-chat-role="assistant"]').length > 0
                      )
                    }, 15000)
                  })
                })
              }
              if (scene === 'v2.1-auto-review') {
                // Enable auto review in settings, then trigger one manual cycle.
                click('[data-action="review-settings"]')
                return waitFor(function () { var toggle = document.querySelector('button[data-auto-enabled]'); return toggle && !toggle.disabled }).then(function () {
                  var toggle = document.querySelector('button[data-auto-enabled]')
                  if (toggle && toggle.getAttribute('aria-checked') !== 'true') toggle.click()
                  return waitFor(function () {
                    var root = document.querySelector('[data-cr-root]')
                    return root && root.getAttribute('data-cr-auto-enabled') === 'true'
                  }, 8000)
                }).then(function () {
                  click('[data-action="settings-close"]')
                  return waitFor(function () { return !document.querySelector('[data-cr-settings]') })
                }).then(function () {
                  click('[data-action="auto-review-run"]')
                  return waitFor(function () {
                    var root = document.querySelector('[data-cr-root]')
                    return root && root.getAttribute('data-cr-auto-running') === 'true'
                  }, 8000)
                }).then(function () {
                  return waitFor(function () {
                    var root = document.querySelector('[data-cr-root]')
                    return (
                      root &&
                      root.getAttribute('data-cr-auto-running') === 'false' &&
                      Number(root.getAttribute('data-cr-auto-recent')) >= 1
                    )
                  }, 12000)
                }).then(function () {
                  return waitFor(function () {
                    var toast = document.querySelector('.cr-toast')
                    return toast && (toast.textContent || '').indexOf('自动审查完成') >= 0
                  }, 8000).then(function (found) {
                    if (found) document.body.dataset.previewAutoToast = '1'
                    var root = document.querySelector('[data-cr-root]')
                    if (root) document.body.dataset.previewAutoRecent = root.getAttribute('data-cr-auto-recent') || '0'
                    return true
                  })
                })
              }
              if (scene === 'v2.1-auto-review-missing') {
                return waitFor(function () {
                  var card = document.querySelector('[data-cr-autoreview]')
                  return card && card.getAttribute('data-auto-supported') === 'false'
                }, 8000)
              }
              return null
            })
            .then(function () {
              if (scene === 'changes') {
                scrollDocTo('.cr-changes-head', 6)
              }
              if (scene === 'v11-inline-findings') {
                centerInDoc('.cr-inline-card', 120)
              }
              if (scene === 'v11-existing-comments') {
                centerInDoc('.cr-inline-comment', 150)
              }
              return waitFor(function () { return document.querySelector('.cr-md, [data-cr-changes]') })
            })
            .then(function () {
              ready = true
              document.body.dataset.previewReady = '1'
              document.body.dataset.previewScene = scene
              window.__PREVIEW_READY__ = true
              if (window.console && console.info) {
                console.info('[preview] scene ready:', scene, 'mode:', mockMode)
              }
            })
            .catch(function (error) {
              document.body.dataset.previewError = String((error && error.stack) || error)
              console.error('[preview] scene failed', error)
            })
        }

        // Load the real plugin bundle once the shim above exists, then boot.
        var bundle = document.createElement('script')
        bundle.src = 'client.js'
        bundle.onload = boot
        bundle.onerror = function () {
          document.getElementById('root').innerHTML = '<div class="pv-loading">client.js 加载失败</div>'
        }
        document.head.appendChild(bundle)
      })()
    </script>
  </body>
</html>
